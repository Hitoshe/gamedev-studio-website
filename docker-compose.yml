
services:
  # 1. Сервис для PHP
  php:
    build:
      context: ./docker/php  # Указываем путь к Dockerfile
    container_name: gamedev_php
    volumes:
      - ./src:/var/www/html # Синхронизируем код с папкой внутри контейнера
    depends_on:
      - db
    environment:
    GMAIL_USER: ${GMAIL_USER}
    GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}

  # 2. Сервис для веб-сервера Nginx
  nginx:
    image: nginx:1.25-alpine # Nginx
    container_name: gamedev_nginx
    ports:
      - "8080:80" # Пробрасываем порт 8080
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # Подключаем конфигурацию Nginx
    depends_on:
      - php # Говорим, что Nginx зависит от PHP

  # 3. Сервис для базы данных PostgreSQL

    #POSTGRES_USER: user
    #POSTGRES_PASSWORD: password
    #POSTGRES_DB: gamedev_db
    #POSTGRES_HOST_AUTH_METHOD: trust
  db:
    image: postgres:13 # Используем официальный образ PostgreSQL
    container_name: gamedev_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Сервис для MongoDB
  mongo:
    image: mongo:5.0
    container_name: gamedev_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: